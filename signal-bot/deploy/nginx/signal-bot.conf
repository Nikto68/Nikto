# Example nginx server block for public/webhook.php. Adjust server_name,
# TLS cert paths, and the php-fpm socket to match your host. Telegram
# requires HTTPS with a valid certificate for setWebhook() to accept the URL.

server {
    listen 443 ssl http2;
    server_name bot.example.com;

    ssl_certificate     /etc/letsencrypt/live/bot.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bot.example.com/privkey.pem;

    root /var/www/signal-bot/public;
    index webhook.php;

    # Only the webhook endpoint is exposed — there is no other public HTTP
    # surface in this project (spec: everything else is the CLI worker).
    location = /webhook.php {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/webhook.php;
        include fastcgi_params;
        client_max_body_size 2m;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name bot.example.com;
    return 301 https://$host$request_uri;
}
