; Alternative to the systemd units in deploy/systemd/ — use whichever your
; host already runs. Drop this in /etc/supervisor/conf.d/signal-bot.conf
; and adjust directory/user, then:
;   supervisorctl reread && supervisorctl update && supervisorctl start signal-bot:*

[program:signal-bot-worker]
command=/usr/bin/php /var/www/signal-bot/worker/market_worker.php
directory=/var/www/signal-bot
user=www-data
autostart=true
autorestart=true
startretries=100
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/www/signal-bot/storage/logs/worker-stdout.log
stderr_logfile=/var/www/signal-bot/storage/logs/worker-stderr.log

; Optional — see the note in deploy/systemd/signal-bot-queue.service.
[program:signal-bot-queue]
command=/usr/bin/php /var/www/signal-bot/worker/queue_worker.php
directory=/var/www/signal-bot
user=www-data
autostart=false
autorestart=true
startretries=100
stopsignal=TERM
stopwaitsecs=15
stdout_logfile=/var/www/signal-bot/storage/logs/queue-stdout.log
stderr_logfile=/var/www/signal-bot/storage/logs/queue-stderr.log

[group:signal-bot]
programs=signal-bot-worker,signal-bot-queue
